# Ibalya TEST — beta.ibalya.com
# Relaie vers le backend Go de test (127.0.0.1:9998). Environnement isolé de la
# prod (autre base, autre process). certbot --nginx ajoute ensuite le TLS.

server {
    listen 80;
    listen [::]:80;
    server_name beta.ibalya.com;

    location ~ /\.env      { return 403; }
    location ~ /\.git      { return 403; }
    location ~ /docker-compose { return 403; }
    location ~ /\.config   { return 403; }

    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Repère visuel : c'est un banc d'essai, pas la prod.
    add_header X-Ibalya-Env "beta" always;

    location / {
        proxy_pass http://127.0.0.1:9998;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
