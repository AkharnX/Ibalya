# Ibalya — ibalya.com
# Relaie vers le backend Go (127.0.0.1:9999), qui sert l'API et le tableau de bord.
# certbot --nginx ajoute ensuite les directives TLS et la redirection HTTP → HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name ibalya.com www.ibalya.com;

    # Fichiers sensibles : jamais exposés
    location ~ /\.env      { return 403; }
    location ~ /\.git      { return 403; }
    location ~ /docker-compose { return 403; }
    location ~ /\.config   { return 403; }

    # Taille maximale d'une requête (corrections de capsule, brouillons longs)
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:9999;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;   # l'extraction et la relecture LLM sont lentes
        proxy_send_timeout 180s;
    }
}
