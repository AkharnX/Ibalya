# Ibalya — ibalya.com
# Relaie vers le backend Go (127.0.0.1:9999), qui sert l'API et le tableau de bord.
# certbot --nginx ajoute ensuite les directives TLS et la redirection HTTP → HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name ibalya.com www.ibalya.com;

    # Fichiers sensibles : jamais exposés
    location ~ /\.env      { return 403; }
    location ~ /\.git      { return 403; }
    location ~ /docker-compose { return 403; }
    location ~ /\.config   { return 403; }

    # Taille maximale d'une requête (corrections de capsule, brouillons longs)
    client_max_body_size 2m;

    # ── En-têtes de sécurité ──
    # « always » est nécessaire : sans lui, nginx omet ces en-têtes sur les
    # réponses d'erreur, précisément celles qu'un attaquant cherche à provoquer.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # L'application ne charge aucune ressource tierce et n'a plus de script en
    # ligne : script-src peut rester strict. « unsafe-inline » ne subsiste que
    # pour les styles, React posant des attributs style sur certains éléments.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location / {
        proxy_pass http://127.0.0.1:9999;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;   # l'extraction et la relecture LLM sont lentes
        proxy_send_timeout 180s;
    }
}
