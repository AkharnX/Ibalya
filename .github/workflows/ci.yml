name: Intégration continue

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Une seule exécution par branche : une nouvelle poussée annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vérifier le formatage
        working-directory: backend
        run: |
          non_formates=$(gofmt -l .)
          if [ -n "$non_formates" ]; then
            echo "Fichiers non formatés (lancer gofmt -w) :"
            echo "$non_formates"
            exit 1
          fi

      - name: Analyse statique
        working-directory: backend
        run: go vet ./...

      - name: Tests
        working-directory: backend
        run: go test -race -count=1 ./...

      - name: Compilation
        working-directory: backend
        run: go build -o /tmp/ibalya ./cmd/server

  inference:
    name: Service d'inférence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dépendances
        run: pip install -q -r llm-service/requirements.txt pytest

      - name: Tests
        env:
          LLM_PROVIDER: mock
        run: python -m pytest llm-service/tests -q

  frontend:
    name: Frontend React
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dépendances
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  coherence:
    name: Cohérence API / interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Le frontend appelle des routes que le backend doit déclarer. Un
      # renommage côté serveur, sans mise à jour du client, provoque un 404
      # silencieux qui retombe sur la page du tableau de bord.
      - name: Chaque appel du frontend correspond-il à une route ?
        run: |
          routes=$(grep -rhoP 'mux\.HandleFunc\("[A-Z]+ /api\K[^"]+' backend/internal/api/ | sort -u)
          manquantes=0
          for appel in $(grep -rhoP "api\('\K/[^']+" frontend/src/ | sed "s/[?].*//" | sort -u); do
            # deux écritures possibles côté client : gabarit `/x/${id}` ou
            # concaténation `'/x/' + id` — les deux visent la même route.
            motif=$(echo "$appel" | sed -E 's#/\$\{[^}]+\}#/{id}#g; s#/$#/{id}#')
            echo "$routes" | grep -qx "$motif" || { echo "route absente du backend : $motif"; manquantes=1; }
          done
          exit $manquantes
